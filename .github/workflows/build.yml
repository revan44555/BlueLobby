name: BlueLobby CI

on:
  push:
    branches: [main]
    tags: ['v*', 'V*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build + Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore BlueLobby.sln
      - name: Build
        run: dotnet build BlueLobby.sln -c Release --no-restore
      - name: Run tests
        run: dotnet run --project Tests/BlueLobby.Tests.csproj -c Release --no-build

  test-windows:
    name: Windows Integration Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore BlueLobby.sln
      - name: Build
        run: dotnet build BlueLobby.sln -c Release --no-restore
      - name: Run tests
        run: dotnet run --project Tests/BlueLobby.Tests.csproj -c Release --no-build

  build-windows:
    name: Publish Windows x64
    needs: [test, test-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: >
          dotnet publish BlueLobby/BlueLobby.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o publish/win-x64
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath BlueLobby-win-x64.zip -Force
      - uses: actions/upload-artifact@v6
        with:
          name: bluelobby-win-x64
          path: BlueLobby-win-x64.zip
          if-no-files-found: error

  build-linux:
    name: Publish Linux x64
    needs: [test, test-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: >
          dotnet publish BlueLobby/BlueLobby.csproj
          -c Release
          -r linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o publish/linux-x64
      - name: Package
        run: |
          chmod +x publish/linux-x64/BlueLobby
          tar -C publish/linux-x64 -czf BlueLobby-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: bluelobby-linux-x64
          path: BlueLobby-linux-x64.tar.gz
          if-no-files-found: error

  release:
    name: GitHub Release
    if: github.ref_type == 'tag'
    needs: [build-windows, build-linux]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/bluelobby-win-x64/BlueLobby-win-x64.zip
            release/bluelobby-linux-x64/BlueLobby-linux-x64.tar.gz
          generate_release_notes: true
          overwrite_files: true
