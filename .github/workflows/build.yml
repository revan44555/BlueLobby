name: BlueLobby CI

on:
  push:
    branches: [main]
    tags: ['v*', 'V*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version/tag to publish (for example V4.3.0). Leave empty for a normal CI run.'
        required: false
        type: string
        default: ''

jobs:
  test:
    name: Build + Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore BlueLobby.sln
      - name: Build
        run: dotnet build BlueLobby.sln -c Release --no-restore
      - name: Run integration tests
        run: dotnet run --project Tests/BlueLobby.Tests.csproj -c Release --no-build
      - name: Run unit tests
        run: dotnet run --project Tests.Unit/BlueLobby.UnitTests.csproj -c Release --no-build

  test-windows:
    name: Windows Integration Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore BlueLobby.sln
      - name: Build
        run: dotnet build BlueLobby.sln -c Release --no-restore
      - name: Build unit tests
        run: dotnet build Tests.Unit/BlueLobby.UnitTests.csproj -c Release --no-restore
      - name: Run integration tests
        run: dotnet run --project Tests/BlueLobby.Tests.csproj -c Release --no-build
      - name: Run unit tests
        run: dotnet run --project Tests.Unit/BlueLobby.UnitTests.csproj -c Release --no-build

  build-windows:
    name: Publish Windows x64
    permissions:
      contents: read
      id-token: write
      attestations: write
    needs: [test, test-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: >
          dotnet publish BlueLobby/BlueLobby.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o publish/win-x64
      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc installer\BlueLobby.iss
          if (-not (Test-Path BlueLobby-Setup.exe)) { throw "BlueLobby-Setup.exe was not created." }
      - name: Package portable Windows build
        shell: pwsh
        run: |
          Compress-Archive -Path publish/win-x64/* -DestinationPath BlueLobby-win-x64.zip -Force
          $zipHash = (Get-FileHash BlueLobby-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  BlueLobby-win-x64.zip" | Set-Content -NoNewline BlueLobby-win-x64.sha256
          $setupHash = (Get-FileHash BlueLobby-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$setupHash  BlueLobby-Setup.exe" | Set-Content -NoNewline BlueLobby-Setup.sha256
      - name: Generate ZIP attestation
        uses: actions/attest@v4
        with:
          subject-path: BlueLobby-win-x64.zip
      - name: Generate installer attestation
        uses: actions/attest@v4
        with:
          subject-path: BlueLobby-Setup.exe
      - uses: actions/upload-artifact@v6
        with:
          name: bluelobby-win-x64
          path: |
            BlueLobby-Setup.exe
            BlueLobby-Setup.sha256
            BlueLobby-win-x64.zip
            BlueLobby-win-x64.sha256
          if-no-files-found: error

  build-linux:
    name: Publish Linux x64
    permissions:
      contents: read
      id-token: write
      attestations: write
    needs: [test, test-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: >
          dotnet publish BlueLobby/BlueLobby.csproj
          -c Release
          -r linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o publish/linux-x64
      - name: Package Linux TAR.GZ
        run: |
          chmod +x publish/linux-x64/BlueLobby
          tar -C publish/linux-x64 -czf BlueLobby-linux-x64.tar.gz .
          sha256sum BlueLobby-linux-x64.tar.gz > BlueLobby-linux-x64.sha256
      - name: Build Linux AppImage
        shell: bash
        run: |
          rm -rf AppDir appimagetool.AppImage BlueLobby.AppImage
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
          cp publish/linux-x64/BlueLobby AppDir/usr/bin/BlueLobby
          cp packaging/BlueLobby.desktop AppDir/BlueLobby.desktop
          cp packaging/bluelobby.svg AppDir/bluelobby.svg
          cp packaging/bluelobby.svg AppDir/usr/share/icons/hicolor/scalable/apps/bluelobby.svg
          cp packaging/AppRun AppDir/AppRun
          chmod +x AppDir/usr/bin/BlueLobby AppDir/AppRun
          curl -L --fail --retry 3 -o appimagetool.AppImage             https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract-and-run AppDir BlueLobby.AppImage
          chmod +x BlueLobby.AppImage
          sha256sum BlueLobby.AppImage > BlueLobby.AppImage.sha256
      - name: Generate TAR.GZ attestation
        uses: actions/attest@v4
        with:
          subject-path: BlueLobby-linux-x64.tar.gz
      - name: Generate AppImage attestation
        uses: actions/attest@v4
        with:
          subject-path: BlueLobby.AppImage
      - uses: actions/upload-artifact@v6
        with:
          name: bluelobby-linux-x64
          path: |
            BlueLobby.AppImage
            BlueLobby.AppImage.sha256
            BlueLobby-linux-x64.tar.gz
            BlueLobby-linux-x64.sha256
          if-no-files-found: error

  release:
    name: GitHub Release
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release_version != '') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release V4.3.0')
    needs: [build-windows, build-linux]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/bluelobby-win-x64/BlueLobby-Setup.exe
            release/bluelobby-win-x64/BlueLobby-Setup.sha256
            release/bluelobby-win-x64/BlueLobby-win-x64.zip
            release/bluelobby-win-x64/BlueLobby-win-x64.sha256
            release/bluelobby-linux-x64/BlueLobby.AppImage
            release/bluelobby-linux-x64/BlueLobby.AppImage.sha256
            release/bluelobby-linux-x64/BlueLobby-linux-x64.tar.gz
            release/bluelobby-linux-x64/BlueLobby-linux-x64.sha256
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_version || 'V4.3.0' }}
          target_commitish: ${{ github.sha }}
          name: BlueLobby ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_version || 'V4.3.0' }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
