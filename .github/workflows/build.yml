name: Build Steam Control Center EXE

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Steam Control Center
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Publish EXE
        run: dotnet publish -c Release -r win-x64 --self-contained false -o publish

      - name: Verify EXE
        shell: pwsh
        run: |
          Write-Host "=== Published files ==="
          Get-ChildItem publish -Recurse

          $exe = Get-ChildItem publish -Filter *.exe -Recurse

          if (-not $exe) {
            Write-Error "EXE bulunamadi!"
            exit 1
          }

          Write-Host ""
          Write-Host "=== EXE FOUND ==="

          foreach ($file in $exe) {
            Write-Host $file.FullName
            Write-Host "Size: $([math]::Round($file.Length / 1KB, 2)) KB"
          }

      - name: Upload EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: publish/*.exe
          generate_release_notes: true
