name: Build Steam Control Center EXE

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Steam Control Center
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Publish EXE
        run: dotnet publish -c Release -r win-x64 --self-contained false -o publish

      - name: Show EXE
        shell: pwsh
        run: |
          Write-Host "Published files:"
          Get-ChildItem publish -Recurse

          $exe = Get-ChildItem publish -Filter *.exe -Recurse

          if (-not $exe) {
            Write-Error "EXE bulunamadi!"
            exit 1
          }

          Write-Host ""
          Write-Host "EXE:"
          $exe | ForEach-Object {
            Write-Host $_.FullName
          }

      # Actions ekranında build çıktısını saklar.
      # GitHub bunu ZIP olarak indirir; bu normal GitHub davranışıdır.
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteamLANControlCenter-EXE
          path: publish/*.exe
          if-no-files-found: error

      # Sen daha sonra tag verdiğinde çalışır.
      # Burada EXE doğrudan Release asset olur.
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: publish/*.exe
          generate_release_notes: true
