name: Build Steam Control Center EXE

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore SteamLANControlCenter.csproj

      - name: Publish EXE
        run: >
          dotnet publish SteamLANControlCenter.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:UseAppHost=true
          -o publish

      - name: Verify EXE
        shell: pwsh
        run: |
          Write-Host "=== Publish output ==="
          Get-ChildItem -Path publish -Recurse

          $exe = Join-Path $PWD "publish\SteamLANControlCenter.exe"

          if (-not (Test-Path $exe)) {
            Write-Error "SteamLANControlCenter.exe bulunamadi."
            exit 1
          }

          $file = Get-Item $exe

          Write-Host ""
          Write-Host "=== EXE FOUND ==="
          Write-Host "Path: $($file.FullName)"
          Write-Host "Size: $([math]::Round($file.Length / 1KB, 2)) KB"

      # Main branch buildleri için geçici/son build Release'ı.
      # Artifact kullanılmıyor; dolayısıyla Actions ZIP'i oluşmuyor.
      - name: Publish Latest Build
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Latest Build
          prerelease: true
          files: publish/SteamLANControlCenter.exe
          overwrite_files: true
          generate_release_notes: false

      # Sen daha sonra v3.0.1, v3.0.2 gibi tag oluşturduğunda
      # doğrudan o Release'e EXE eklenir.
      - name: Publish Versioned Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: publish/SteamLANControlCenter.exe
          overwrite_files: true
          generate_release_notes: true
