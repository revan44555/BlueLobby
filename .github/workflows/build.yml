name: Build BlueLobby EXE

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore BlueLobby.csproj

      - name: Publish EXE
        run: >
          dotnet publish BlueLobby.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:UseAppHost=true
          -o publish

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "publish\BlueLobby.exe"

          if (-not (Test-Path $exe)) {
              Write-Error "BlueLobby.exe bulunamadi."
              exit 1
          }

          $file = Get-Item $exe

          Write-Host "================================"
          Write-Host "EXE BASARIYLA OLUSTURULDU"
          Write-Host "================================"
          Write-Host "Dosya: $($file.Name)"
          Write-Host "Boyut: $([math]::Round($file.Length / 1KB, 2)) KB"
          Write-Host "Yol:   $($file.FullName)"
          Write-Host "================================"

      - name: Update Latest Build
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Latest BlueLobby Build
          prerelease: true
          files: publish/BlueLobby.exe
          overwrite_files: true
          generate_release_notes: false

      - name: Create Versioned Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: publish/BlueLobby.exe
          overwrite_files: true
          generate_release_notes: true
          
