name: Build BlueLobby

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Core Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Run tests
        run: dotnet run -c Release --project Tests/BlueLobby.Tests.csproj

  build-windows:
    name: Build Windows EXE
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Publish win-x64
        run: >
          dotnet publish BlueLobby/BlueLobby.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o publish
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bluelobby-win-x64
          path: publish/
      - name: Update Latest Build
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Latest BlueLobby Build
          prerelease: true
          files: publish/BlueLobby.exe
          overwrite_files: true
          generate_release_notes: false
      - name: Create Versioned Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: publish/BlueLobby.exe
          overwrite_files: true
          generate_release_notes: true

  build-linux:
    name: Build Linux Binary
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Publish linux-x64
        run: >
          dotnet publish BlueLobby/BlueLobby.csproj
          -c Release
          -r linux-x64
          --self-contained true
          -o publish
      - name: Make executable
        run: chmod +x publish/BlueLobby
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bluelobby-linux-x64
          path: publish/
      - name: Release Linux binary
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: publish/BlueLobby
          overwrite_files: true
          generate_release_notes: false
          
